apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: my-hpa
  labels:
    app: game-app
spec:
  scaleTargetRef:
    apiVersion: app/v1
    kind: Deployment
    name: my-game-deploy
  minReplicas: 1
  maxReplicas: 4
  metrics:
  - type: Resources
    resources:
      name: cpu
      target:
        type: Utilization
        avarageUtilization: 50
    
